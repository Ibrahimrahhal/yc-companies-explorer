name: Feature request
description: Ideas that make exploring YC companies better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What friction are you hitting today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Alternatives / references
      description: Optional links, mockups, or other tools.
