name: Bug report
description: Something broken in YC Companies Explorer
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional, but very helpful.
